<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeType</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/mobile.css">

</head>

<body class="theme-dark">

<div class="container">

    <header>

        <h1>CodeType</h1>

        <div class="settings">

            <div class="languages">

                <button class="language-btn" data-language="cpp">
                    C++
                </button>

                <button class="language-btn" data-language="python">
                    Python
                </button>

                <button class="language-btn" data-language="javascript">
                    JavaScript
                </button>

                <button class="language-btn" data-language="csharp">
                    C#
                </button>

            </div>

            <div class="times">

                <button class="time-btn" data-time="15">
                    15s
                </button>

                <button class="time-btn" data-time="30">
                    30s
                </button>

                <button class="time-btn active" data-time="60">
                    60s
                </button>

                <button class="time-btn" data-time="120">
                    120s
                </button>

            </div>

        </div>

        <div class="theme-selector">

            <button id="dark-theme">
                Dark
            </button>

            <button id="light-theme">
                Light
            </button>

            <button id="dracula-theme">
                Dracula
            </button>

        </div>

    </header>

    <main>

        <section id="snippet-container">

            <pre id="snippet">

Loading snippet... </pre>

        </section>

        <section id="typing-section">

            <textarea
                id="typing-input"
                placeholder="Start typing the code here..."
                autocomplete="off"
                spellcheck="false">
            </textarea>

    <button id="submit-test">
    Submit Test
    </button>

        </section>

    </main>

    <footer>

        <div class="stat-box">

            <span>WPM</span>

            <h2 id="wpm">0</h2>

        </div>

        <div class="stat-box">

            <span>Accuracy</span>

            <h2 id="accuracy">100%</h2>

        </div>

        <div class="stat-box">

            <span>Errors</span>

            <h2 id="errors">0</h2>

        </div>

        <div class="stat-box">

            <span>Time</span>

            <h2 id="timer">60</h2>

        </div>

        <div class="stat-box">

            <span>Best WPM</span>

            <h2 id="best-wpm">0</h2>

        </div>

    </footer>

</div>

<!-- Core Modules -->

<script src="js/snippets.js"></script>
<script src="js/ui.js"></script>
<script src="js/stats.js"></script>
<script src="js/timer.js"></script>
<script src="js/storage.js"></script>
<script src="js/typing.js"></script>
<script src="js/app.js"></script>

</body>
</html>
